# Voice-to-keyboard configuration.
#
# The audio block is the swap point for better hardware. Moving from the cheap
# USB capsule to a beamforming array (ReSpeaker, etc.) should mean editing this
# block only -- no code changes downstream.

audio:
  # Matched as a substring against PortAudio's device names, or an integer index.
  #
  # "voicekbmic" is an ALSA plug device defined by scripts/setup_alsa.sh, not the
  # raw capsule. It exists because the PCM2902 codec will not give PortAudio a
  # 16 kHz stream directly (paInvalidSampleRate), and plug converts transparently.
  # It also insulates us from the ALSA card number, which changes across reboots
  # and USB ports.
  #
  # For a mic array later, re-point setup_alsa.sh at the new card and leave this
  # name alone. scripts/check_mic.py --list shows what PortAudio can see.
  device: voicekbmic

  # Downstream (VAD + whisper.cpp) is fixed at 16 kHz mono int16. Don't change
  # these two without changing the consumers.
  sample_rate: 16000
  frame_ms: 30 # webrtcvad accepts only 10, 20, or 30

  # Capture channel count. 1 for the USB capsule; 4 or 6 for a mic array.
  channels: 1

  # How to collapse multichannel capture to mono:
  #   null -> average all channels
  #   <int> -> take that channel index only (a ReSpeaker's beamformed output
  #            is usually channel 0, with the raw capsules on 1..N)
  channel_select: null

  # Hardware capture volume, applied via `amixer` by scripts/set_gain.sh.
  # This is the *first* knob to turn, because it amplifies early in the chain and
  # costs far less SNR than software gain does.
  #
  # 62% (step 10/16, 14.88 dB) was measured, not guessed. At 81% this capsule
  # peaked at -1.6 dBFS on normal speech -- only 1.6 dB from clipping, which
  # normal speech variation would blow through. Backing off ~4.5 dB puts peaks
  # near -6 dBFS with headroom to spare, and SNR was 38 dB so there is plenty to
  # give away. Clipped audio hurts whisper far more than a quieter signal does.
  alsa_capture_percent: 62

  # Second-order high-pass cutoff, in Hz. 0 disables.
  #
  # Speech carries essentially nothing below 80 Hz, but a close-mic'd cheap
  # capsule carries plenty: plosive thump on P/B/T, the proximity-effect bass
  # lift, desk rumble, DC offset. Removing it helps whisper (no energy that
  # encodes no phonemes) and helps the VAD (no triggering on breath blasts).
  highpass_hz: 80

  # Software gain applied after capture, as a last resort. This amplifies the
  # noise floor along with your voice, so raise alsa_capture_percent first.
  # 1.0 = off.
  software_gain: 1.0

vad:
  # webrtcvad aggressiveness, 0-3. Higher rejects more non-speech but starts
  # clipping quiet syllables.
  aggressiveness: 2
  # Speech must persist this long to open an utterance (rejects clicks).
  start_ms: 150
  # Silence this long closes it. This is the single biggest contributor to
  # perceived latency: nothing downstream runs until the utterance closes, so
  # every millisecond here is added to every dictation. Too short, though, and
  # normal mid-sentence pauses split one thought into two.
  silence_ms: 1200
  # Audio retained from before the trigger fired. Without it the first syllable
  # is reliably lost, because by the time enough speech frames accumulate to
  # trigger, that syllable has already gone past.
  pre_roll_ms: 300
  min_utterance_ms: 400
  max_utterance_s: 30

  # Reject utterances quieter than this (RMS dBFS) before spending whisper on
  # them. webrtcvad triggers on spectral shape, not loudness, so quiet room
  # noise opens utterances that come back as "(crickets chirping)". Measured
  # noise floor ~-53 dBFS, speech ~-15 dBFS, so this sits in a wide gap.
  min_level_dbfs: -42

stt:
  # small.en over base.en for accuracy. It only became viable once the active
  # cooler was fitted: previously it hit 81.8 C and was throttled to 3.27x
  # realtime; cooled it runs at 0.94x and peaks at 51.6 C.
  #
  # Transcription errors propagate and nothing downstream can undo them --
  # base.en heard 'auth token' as 'odd token', and no reformatting layer can
  # recover a word that was never transcribed. Accuracy here is worth more
  # than anywhere else in the pipeline.
  model: models/ggml-small.en-q5_1.bin
  binary: vendor/whisper.cpp/build/bin/whisper-cli
  threads: 4
  beam_size: 5
  language: en

  # Known mis-transcriptions, applied verbatim after whisper. whisper cannot
  # emit a word outside its vocabulary, so an invented term comes back mangled
  # the same way every time -- "voicekb" is reliably "voice he be". That
  # consistency is what makes a lookup table work where audio tuning cannot.
  # Explicit phrases only; no fuzzy matching, which would eventually rewrite a
  # word you actually said.
  substitutions:
    "voice he be": voicekb
    "voice kb": voicekb
    "voice cabey": voicekb

llm:
  enabled: true
  # AI-shaped output is the default, per the original design. 'structured'
  # rather than 'clean' because clean no longer calls the model at all --
  # its filler removal is deterministic. structured is the profile built to
  # preserve every point rather than compress, measured at 0.88 overlap.
  #
  # Costs roughly 1.5-6s per utterance on top of whisper. Say 'clean mode'
  # or 'raw mode' to drop back without restarting.
  profile: structured     # clean | slack | commit | email | structured | raw
  base_url: http://127.0.0.1:8080
  model: models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
  binary: vendor/llama.cpp/build/bin/llama-server
  threads: 4
  context_size: 2048
  timeout_s: 60

  # Terms speech-to-text reliably mangles. "voicekb" came back as "voice he be":
  # an invented word has no entry in base.en's vocabulary, so no amount of audio
  # tuning fixes it. The LLM can restore it from context.
  vocabulary:
    - voicekb

  # If the LLM server is unreachable, type the raw transcription rather than
  # dropping the utterance. Losing dictation is worse than losing formatting.
  fallback_to_raw: true

buttons:
  enabled: true

  # push_to_talk: hold the button to capture, release to transcribe.
  #
  # This is the point of the button. Release is a *statement* that you have
  # finished speaking, so the whole silence-timing guess disappears: no
  # mid-sentence splits when you pause to think, no room noise opening
  # utterances that cost 2.5s of whisper to discover were "(crickets
  # chirping)", and no waiting out a silence window before anything happens.
  #
  # profile_cycle: each press steps through `cycle` instead.
  mode: push_to_talk

  # BCM numbering. GPIO17 is physical pin 11, with a ground on physical pin 9.
  # Wire one tactile-switch leg to each; use DIAGONALLY opposite legs, since the
  # two legs on each side of a 4-pin switch are bridged internally.
  pin: 17
  bounce_ms: 50

  # Audio kept from just before the press. People commonly start the first
  # syllable as they press rather than after.
  pre_roll_ms: 200
  # Shorter than this is an accidental tap, not speech.
  min_utterance_ms: 200
  # Safety cap in case the button sticks.
  max_hold_s: 120

  # Only used when mode is profile_cycle.
  cycle: [clean, raw]

logging:
  # Whether the journal records the transcribed TEXT of each utterance.
  #
  # True is genuinely useful -- nearly every bug in this build was found by
  # comparing what whisper heard against what got typed. But it does mean the
  # journal accumulates a record of everything ever dictated into this device.
  # Set false to keep timings and lengths only.
  #
  # Retention is capped separately by scripts/setup_logging.sh (200M, 1 week).
  log_transcripts: true
